services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: support_db_admin
      POSTGRES_DB: support_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_db_admin -d support_agent"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  app:
    image: kefuagent:local
    build: .
    env_file: .env.compose
    environment:
      DOCUMENT_STORAGE_ROOT: /data/documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; h=urllib.parse.urlsplit(os.environ['WEB_ORIGIN']).netloc; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host': h}); urllib.request.urlopen(r, timeout=5).close()"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 15s
    # Allow in-flight requests to drain before the runtime sends SIGKILL.
    stop_grace_period: 180s
    restart: unless-stopped
  worker:
    image: kefuagent:local
    build: .
    profiles: ["worker"]
    command: ["python", "-m", "support_agent.worker", "--interval", "30"]
    env_file: .env.compose
    environment:
      DOCUMENT_STORAGE_ROOT: /data/documents
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  postgres_data:
  document_data:
