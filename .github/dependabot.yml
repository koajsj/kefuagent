version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
