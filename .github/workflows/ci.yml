name: Static and delivery checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-isolated-postgres-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://support_app:ci-isolated-app-only@127.0.0.1:5432/support_agent_dev
      MIGRATION_DATABASE_URL: postgresql+psycopg://support_migrator:ci-isolated-migrator-only@127.0.0.1:5432/support_agent_dev
      ALLOW_EXTERNAL_MODELS: 'false'
      DOCUMENT_STORAGE_ROOT: .local/ci-documents
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Locked dependencies
        run: uv sync --locked
      - name: Fresh isolated PostgreSQL and additive migrations
        env:
          PGPASSWORD: ci-isolated-postgres-only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE support_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-isolated-app-only'"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE support_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-isolated-migrator-only'"
          createdb -h 127.0.0.1 -U postgres -O support_migrator support_agent_dev
          uv run alembic upgrade head
          psql -h 127.0.0.1 -U postgres -d support_agent_dev -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON DATABASE support_agent_dev FROM PUBLIC;
          GRANT CONNECT ON DATABASE support_agent_dev TO support_app;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO support_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO support_app;
          REVOKE INSERT, UPDATE, DELETE ON alembic_version FROM support_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO support_app;
          SQL
      - name: Static and isolated schema checks
        run: uv run python scripts/check.py --database
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: React production and isolated Demo builds
        run: |
          npm ci --prefix frontend --no-fund --no-audit
          npm run build --prefix frontend
          npm run build:demo --prefix frontend
      - name: Package and JavaScript delivery contracts
        run: |
          uv build --wheel --out-dir .local/ci-dist
          uv run python scripts/check_delivery.py --wheel .local/ci-dist/*.whl
