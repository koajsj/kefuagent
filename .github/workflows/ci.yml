name: Offline acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-isolated-postgres-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://support_app:ci-isolated-app-only@127.0.0.1:5432/support_agent_dev
      TEST_DATABASE_URL: postgresql+psycopg://support_app:ci-isolated-app-only@127.0.0.1:5432/support_agent_test
      ALLOW_EXTERNAL_MODELS: 'false'
      DOCUMENT_STORAGE_ROOT: .local/ci-documents
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Locked dependencies
        run: uv sync --locked
      - name: Fresh isolated PostgreSQL and additive migrations
        env:
          PGPASSWORD: ci-isolated-postgres-only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE support_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-isolated-app-only'"
          createdb -h 127.0.0.1 -U postgres -O support_app support_agent_dev
          createdb -h 127.0.0.1 -U postgres -O support_app support_agent_test
          uv run alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
      - name: Static, schema and bounded regressions (once)
        run: uv run python scripts/check.py
      - name: Package and JavaScript delivery contracts
        run: |
          uv build --wheel --out-dir .local/ci-dist
          uv run python scripts/check_delivery.py --wheel .local/ci-dist/*.whl
