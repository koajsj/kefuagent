[project]
name = "support-agent-platform"
version = "0.6.0"
description = "Multi-tenant customer support RAG and bounded, authorized tool execution workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25.1,<26",
  "jsonschema>=4.25,<5",
  "uvicorn>=0.40,<1",
  "cryptography>=46,<51",
  "pypdf>=6.6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.22,<1",
  "httpcore>=1.0.9,<2",
  "psutil>=7,<9",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx2>=2,<3", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
